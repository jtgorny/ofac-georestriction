name: Release Please

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The remaining steps run only on the push that merged the release PR.
      - name: Check out the release commit
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Move the floating major tag to the new release
        if: ${{ steps.release.outputs.release_created }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force "v${{ steps.release.outputs.major }}"
          git push origin "refs/tags/v${{ steps.release.outputs.major }}" --force
